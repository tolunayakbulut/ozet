name: refresh-instagram-token

# Long-lived Instagram tokens expire after 60 days; refresh monthly.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }} # fine-grained PAT with Secrets: read/write on this repo
        run: |
          TOKEN=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN" | jq -r .access_token)
          test -n "$TOKEN" && test "$TOKEN" != null
          echo "::add-mask::$TOKEN"
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$TOKEN"

name: history

# Tarihte Bugün, every day at 12:30 Istanbul. Same trigger scheme as daily.yml:
# - cron-job.org at 12:10 Istanbul: workflow_dispatch with inputs.auto=true (primary, on time)
# - GitHub cron below: backup, since Actions schedules can run hours late or not at all
# - manual "Run workflow": publishes immediately, still skipped if today is already published
# published-history/<date> on the images branch keeps it to one post a day.
on:
  schedule:
    - cron: "50 8 * * *" # 11:50 Istanbul
    - cron: "37 9,10,11 * * *" # 12:37, 13:37, 14:37 Istanbul: fallbacks, no-op if already published
  workflow_dispatch:
    inputs:
      auto:
        description: "Automatic trigger: wait until 12:30, skip outside the 11:00-17:00 window"
        type: boolean
        default: false
      force:
        description: "Publish even if today is already published (posts again!)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      date: ${{ steps.check.outputs.date }}
      auto: ${{ steps.check.outputs.auto }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: images
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: published-history/
          sparse-checkout-cone-mode: false # cone mode would also download every root-level image/video

      - name: Already published today?
        id: check
        env:
          AUTO: ${{ github.event_name == 'schedule' || github.event.inputs.auto == 'true' }}
          FORCE: ${{ github.event.inputs.force == 'true' }}
        run: |
          DATE=$(TZ=Europe/Istanbul date +%F)
          HOUR=$(TZ=Europe/Istanbul date +%-H)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "auto=$AUTO" >> "$GITHUB_OUTPUT"
          SKIP=false
          if [ -e "published-history/$DATE" ] && [ "$FORCE" != true ]; then
            echo "::notice::$DATE already published ($(cat "published-history/$DATE")), skipping"
            SKIP=true
          elif [ "$AUTO" = true ] && { [ "$HOUR" -lt 11 ] || [ "$HOUR" -ge 17 ]; }; then
            echo "::notice::Automatic run at $HOUR:xx, outside the 11:00-17:00 Istanbul window, skipping"
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  run:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
      EDITION_DATE: ${{ needs.check.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Render
        run: npm run history
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Push image to images branch (public URL for Instagram)
        id: image
        run: |
          DATE=$EDITION_DATE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git fetch origin images:images
          git worktree add /tmp/images images
          mkdir -p /tmp/images/history
          cp "out/history/$DATE/01.jpg" "/tmp/images/history/$DATE.jpg"
          cp "out/history/$DATE/video.mp4" "/tmp/images/history/$DATE.mp4"
          git -C /tmp/images add history && git -C /tmp/images commit -m "history $DATE" && git -C /tmp/images push origin images
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/images/history"
          echo "url=$BASE/$DATE.jpg" >> "$GITHUB_OUTPUT"
          echo "video=$BASE/$DATE.mp4" >> "$GITHUB_OUTPUT"

      - name: Wait until 12:30 Istanbul (automatic runs only)
        if: needs.check.outputs.auto == 'true'
        run: |
          TARGET=$(date -u -d "09:30" +%s)
          NOW=$(date -u +%s)
          if [ "$NOW" -lt "$TARGET" ]; then sleep $((TARGET - NOW)); fi

      # Marked before publishing, not after: a partly failed publish must not be retried by the
      # fallback triggers, or the platforms that succeeded would get the post twice.
      - name: Mark today as published
        env:
          FORCE: ${{ github.event.inputs.force == 'true' }}
        run: |
          DATE=$EDITION_DATE
          git -C /tmp/images pull -q --rebase origin images
          if [ -e "/tmp/images/published-history/$DATE" ] && [ "$FORCE" != true ]; then
            echo "::error::$DATE was published by another run in the meantime"
            exit 1
          fi
          mkdir -p /tmp/images/published-history
          echo "run ${{ github.run_id }} (${{ github.event_name }})" > "/tmp/images/published-history/$DATE"
          git -C /tmp/images add published-history
          git -C /tmp/images commit -qm "published history $DATE"
          git -C /tmp/images push -q origin images

      - name: Publish
        run: npm run publish-history -- "$EDITION_DATE"
        env:
          IMAGE_URL: ${{ steps.image.outputs.url }}
          VIDEO_URL: ${{ steps.image.outputs.video }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history
          path: out/history/

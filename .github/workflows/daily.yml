name: daily

# Triggers (any one is enough; published/<date> on the images branch keeps it to one post a day):
# - cron-job.org at 19:40 Istanbul: workflow_dispatch with inputs.auto=true (primary, on time)
# - GitHub cron below: backup, since Actions schedules can run hours late or not at all
# - manual "Run workflow": publishes immediately, still skipped if today is already published
on:
  schedule:
    - cron: "15 16 * * *" # 19:15 Istanbul
    - cron: "7 17,18,19 * * *" # 20:07, 21:07, 22:07 Istanbul: fallbacks, no-op if already published
  workflow_dispatch:
    inputs:
      auto:
        description: "Automatic trigger: wait until 20:00, skip outside the evening window"
        type: boolean
        default: false
      force:
        description: "Publish even if today is already published (posts again!)"
        type: boolean
        default: false

permissions:
  contents: write

# Runs never overlap: a second trigger waits, then sees the published marker and skips.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      date: ${{ steps.check.outputs.date }}
      auto: ${{ steps.check.outputs.auto }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: images
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: published/
          sparse-checkout-cone-mode: false # cone mode would also download every root-level image/video

      - name: Already published today?
        id: check
        env:
          AUTO: ${{ github.event_name == 'schedule' || github.event.inputs.auto == 'true' }}
          FORCE: ${{ github.event.inputs.force == 'true' }}
        run: |
          # Edition date: a run before 06:00 Istanbul belongs to the previous evening (same rule as src/index.ts).
          DATE=$(TZ=Europe/Istanbul date -d "6 hours ago" +%F)
          HOUR=$(TZ=Europe/Istanbul date +%-H)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "auto=$AUTO" >> "$GITHUB_OUTPUT"
          SKIP=false
          if [ -e "published/$DATE" ] && [ "$FORCE" != true ]; then
            echo "::notice::$DATE already published ($(cat "published/$DATE")), skipping"
            SKIP=true
          elif [ "$AUTO" = true ] && [ "$HOUR" -lt 19 ] && [ "$HOUR" -ge 3 ]; then
            echo "::notice::Automatic run at $HOUR:xx, outside the 19:00-03:00 Istanbul window, skipping"
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  run:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
      EDITION_DATE: ${{ needs.check.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Render
        run: npm start
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Push image to images branch (public URL for Instagram)
        id: image
        run: |
          DATE=$EDITION_DATE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git fetch origin images:images || git branch images "$(git commit-tree "$(git hash-object -t tree /dev/null)" -m init)"
          git worktree add /tmp/images images
          cp "out/$DATE/01.jpg" "/tmp/images/$DATE.jpg"
          cp "out/$DATE/video.mp4" "/tmp/images/$DATE.mp4"
          [ -f "out/$DATE/02.jpg" ] && cp "out/$DATE/02.jpg" "/tmp/images/$DATE-manset.jpg"
          git -C /tmp/images add . && git -C /tmp/images commit -m "$DATE" && git -C /tmp/images push origin images
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/images"
          echo "url=$BASE/$DATE.jpg" >> "$GITHUB_OUTPUT"
          echo "video=$BASE/$DATE.mp4" >> "$GITHUB_OUTPUT"
          if [ -f "out/$DATE/02.jpg" ]; then echo "manset=$BASE/$DATE-manset.jpg" >> "$GITHUB_OUTPUT"; fi

      - name: Wait until 20:00 Istanbul (automatic runs only)
        if: needs.check.outputs.auto == 'true'
        run: |
          TARGET=$(date -u -d "17:00" +%s)
          NOW=$(date -u +%s)
          if [ "$NOW" -lt "$TARGET" ]; then sleep $((TARGET - NOW)); fi

      # Marked before publishing, not after: a partly failed publish must not be retried by the
      # fallback triggers, or the platforms that succeeded would get the post twice.
      - name: Mark today as published
        env:
          FORCE: ${{ github.event.inputs.force == 'true' }}
        run: |
          DATE=$EDITION_DATE
          git -C /tmp/images pull -q --rebase origin images
          if [ -e "/tmp/images/published/$DATE" ] && [ "$FORCE" != true ]; then
            echo "::error::$DATE was published by another run in the meantime"
            exit 1
          fi
          mkdir -p /tmp/images/published
          echo "run ${{ github.run_id }} (${{ github.event_name }})" > "/tmp/images/published/$DATE"
          git -C /tmp/images add published
          git -C /tmp/images commit -qm "published $DATE"
          git -C /tmp/images push -q origin images

      - name: Publish
        run: npm run publish -- "$EDITION_DATE"
        env:
          IMAGE_URL: ${{ steps.image.outputs.url }}
          VIDEO_URL: ${{ steps.image.outputs.video }}
          MANSET_URL: ${{ steps.image.outputs.manset }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: X experiment log and metrics
        if: always()
        run: |
          DATE=$EDITION_DATE
          mkdir -p /tmp/images/data/x
          if [ -f "out/$DATE/x.json" ]; then cp "out/$DATE/x.json" "/tmp/images/data/x/$DATE.json"; fi
          node --import tsx src/x-metrics.ts /tmp/images/data/x
          git -C /tmp/images add data
          git -C /tmp/images commit -qm "x log $DATE" && git -C /tmp/images push -q origin images || true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out/

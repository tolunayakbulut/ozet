name: daily

on:
  schedule:
    - cron: "15 16 * * *" # 19:15 Istanbul; start early since Actions cron can run late, publish waits for 20:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Render
        run: npm start
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Push image to images branch (public URL for Instagram)
        id: image
        run: |
          DATE=$(date -u +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git fetch origin images:images || git branch images "$(git commit-tree "$(git hash-object -t tree /dev/null)" -m init)"
          git worktree add /tmp/images images
          cp "out/$DATE/01.jpg" "/tmp/images/$DATE.jpg"
          cp "out/$DATE/video.mp4" "/tmp/images/$DATE.mp4"
          git -C /tmp/images add . && git -C /tmp/images commit -m "$DATE" && git -C /tmp/images push origin images
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/images"
          echo "url=$BASE/$DATE.jpg" >> "$GITHUB_OUTPUT"
          echo "video=$BASE/$DATE.mp4" >> "$GITHUB_OUTPUT"

      - name: Wait until 20:00 Istanbul (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(date -u -d "17:00" +%s)
          NOW=$(date -u +%s)
          if [ "$NOW" -lt "$TARGET" ]; then sleep $((TARGET - NOW)); fi

      - name: Publish
        run: npm run publish -- "$(date -u +%F)"
        env:
          IMAGE_URL: ${{ steps.image.outputs.url }}
          VIDEO_URL: ${{ steps.image.outputs.video }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: X experiment log and metrics
        if: always()
        run: |
          DATE=$(date -u +%F)
          mkdir -p /tmp/images/data/x
          if [ -f "out/$DATE/x.json" ]; then cp "out/$DATE/x.json" "/tmp/images/data/x/$DATE.json"; fi
          node --import tsx src/x-metrics.ts /tmp/images/data/x
          git -C /tmp/images add data
          git -C /tmp/images commit -qm "x log $DATE" && git -C /tmp/images push -q origin images || true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out/
